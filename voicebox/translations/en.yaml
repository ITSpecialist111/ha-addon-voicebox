configuration:
  log_level:
    name: Log level
    description: >-
      Verbosity of the Voicebox log. Use debug when investigating a problem.
  min_free_ram_mb:
    name: Minimum free RAM (MB)
    description: >-
      Refuse to start unless at least this much memory is actually available.
      Default 8192, the minimum Voicebox states for a single engine. That figure
      is a peak-during-inference one, not a resident one — measured idle usage is
      around 600 MB — so 6000 is often a workable value on a 16 GB machine. Set
      to 0 to disable the check entirely.
  allow_low_ram_start:
    name: Allow start with insufficient RAM
    description: >-
      Downgrade the memory check from a hard stop to a warning. Risky — add-ons
      are preferred OOM-kill targets, so starting short can take other add-ons
      down with it. Read the documentation first.
  cors_origins:
    name: CORS origins
    description: >-
      Optional comma-separated list of allowed browser origins for the API.
      Leave empty unless you are calling Voicebox from a web page hosted
      elsewhere.
  cpu_priority:
    name: CPU priority
    description: >-
      Low runs Voicebox under nice 19, so it gives way to other add-ons whenever
      they need the CPU. Recommended when something latency-sensitive such as
      Frigate shares the machine: voice generation gets slower under load rather
      than the NVR dropping frames. Normal competes on equal terms.
  allow_large_model:
    name: Allow the large (1.7B) model
    description: >-
      Voicebox ships two text-to-speech models. On a 16 GB machine the small
      one (0.6B) peaks at about 4.2 GB and works; the large one (1.7B) peaks at
      about 8.1 GB and gets killed by the kernel. Upstream defaults every entry
      point to the large one, so this add-on rewrites those defaults and
      refuses the large model with a clear error instead. Turn this on only if
      the host really can spare 8 GB — add-ons are the kernel's preferred
      victims, so an out-of-memory event here can take Frigate down with it.
network:
  8000/tcp: >-
    Voicebox web UI and REST API. NOTE: Voicebox has no authentication of its
    own, and anyone who can reach this port can stop the service, so only
    publish it on a trusted network. The ingress panel is the safer route.
