name: Voicebox
version: "0.7.1"
slug: voicebox
description: >-
  Local AI voice studio — text-to-speech, voice cloning and transcription.
  Runs entirely on your own hardware.
url: https://github.com/ITSpecialist111/ha-addon-voicebox
arch:
  - amd64
  - aarch64

# Requires a lot of RAM. Never start this automatically — a failed start on a
# constrained host takes other add-ons down with it. The user opts in each time
# until they are confident it fits. See DOCS.md → "Will this fit?".
boot: manual
startup: application

# NO watchdog on purpose.
# A watchdog restarts the container when the health URL stops answering. The
# most likely reason for that here is the OOM killer, and restarting an
# OOM-killed 8 GB process in a loop turns one bad event into a permanent
# thrash that takes the whole machine with it. Fail once, loudly, and stop.

ports:
  8000/tcp: 17493
ports_description:
  8000/tcp: >-
    Voicebox web UI and REST API. Published on host port 17493 by default.
    The API has NO authentication of any kind — including an unauthenticated
    POST /shutdown — so only expose it on a trusted LAN. Prefer the ingress
    panel, which puts Home Assistant's own login in front of it.

webui: "http://[HOST]:[PORT:8000]/"

# Ingress puts the UI behind Home Assistant's own authentication, which matters
# because Voicebox itself has none.
#
# The shipped single-page app does not survive this unaided. It is a desktop-app
# build: it references its assets with absolute paths, and every API call goes to
# a hardcoded http://127.0.0.1:17493. Unpatched it renders blank under ingress
# AND calls the wrong machine over the direct port. patch-frontend.py rewrites
# both at build time so the UI works either way. The direct port stays as a
# fallback.
ingress: true
ingress_port: 8000
panel_icon: mdi:account-voice
panel_title: Voicebox

# Model cache is several GB. Excluding it keeps backups sane — it is a cache
# and re-downloads on demand.
backup: cold
backup_exclude:
  - "cache/**"

# NOTE: deliberately no `image:` key. With `image:` set, Supervisor pulls that
# tag from a registry and ignores the Dockerfile entirely. There is no
# published wrapper image, so Supervisor must build locally from the Dockerfile
# when the repository is added. Building takes a couple of minutes; the heavy
# ML layers come from the upstream image and are only downloaded once.

options:
  log_level: info
  min_free_ram_mb: 8192
  allow_low_ram_start: false
  cors_origins: ""
  cpu_priority: low
  allow_large_model: false

schema:
  log_level: list(debug|info|warning|error)
  # Refuse to start unless this much RAM is actually available. Defaults to the
  # 8192 MB Voicebox states as its minimum for a single engine.
  min_free_ram_mb: int(0,262144)
  # Escape hatch. Setting this true downgrades the RAM check from a hard stop
  # to a warning. Read DOCS.md before touching it.
  allow_low_ram_start: bool
  cors_origins: str?
  # Frigate and friends are latency-critical; Voicebox inference is not.
  # 'low' runs it under nice 19 so it yields whenever anything else wants the
  # CPU. Only affects behaviour when the CPU is actually contended.
  cpu_priority: list(low|normal)
  # Voicebox ships two TTS models. Measured on this class of hardware:
  #   0.6B  ~4.2 GB peak  -> fits
  #   1.7B  ~8.1 GB peak  -> OOM-killed
  # Upstream defaults every entry point to 1.7B, so the build rewrites those
  # defaults and guards the loader. Leave this false unless the host really
  # can spare ~8.1 GB; an OOM here takes other add-ons with it.
  allow_large_model: bool
